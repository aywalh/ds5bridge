[package]
name = "ds5bridge"
version = "1.0.3"
edition = "2021"
description = "Use PlayStation controllers over USB or Bluetooth with optional Xbox 360 output on Windows. No telemetry."
license = "MIT"
readme = "README.md"
keywords = ["dualsense", "dualshock", "controller", "xinput", "vigem"]
categories = ["hardware-support"]

[dependencies]
# lightweight: OpenGL (glow) instead of wgpu, no Linux/web parts; accesskit for screen readers
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit"] }


[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
