# Push a tag like v1.2.0 (matching the version in Cargo.toml) to build and publish a release.
# The in-app updater downloads DS5Bridge.exe from it and checks its SHA-256 before installing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal

      - name: Tag matches Cargo.toml version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != Cargo.toml version $v" }

      - run: cargo test --release
      - run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/ds5bridge.exe DS5Bridge.exe
          $hash = (Get-FileHash DS5Bridge.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DS5Bridge.exe" | Out-File -Encoding ascii DS5Bridge.exe.sha256
          "SHA-256: $hash"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" DS5Bridge.exe DS5Bridge.exe.sha256 --title "DS5 Bridge ${{ github.ref_name }}" --generate-notes
